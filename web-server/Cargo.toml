[package]
name = "coolapk-web-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "multipart", "rustls-tls", "stream"] }
bcrypt = "0.15"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
chrono = "0.4"
anyhow = "1"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
debug = 0
strip = true
lto = false
codegen-units = 16
